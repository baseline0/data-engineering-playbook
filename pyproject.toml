[project]
name = "data-engineering-playbook"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "dbt>=2.0.8",
]

[dependency-groups]
dev = [
    {include-group = "test"},
    "ruff>=0.17.1",
    "pyright>=1.1.0",
    "import-linter>=2.0.0,<3.0.0",
    "pre-commit>=4.6.2",
]
test = ["pytest>=9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["unit: deterministic, isolated, no external dependencies", "integration: tests that use real services or files across components", "e2e: end-to-end tests of a whole workflow", "unit: deterministic, isolated, no network/services/sibling repos", "integration: cross-repo/service interaction; requires local setup", "host: runs on the real host (services, sibling repos, LXC); never in CI"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [".venv", ".git", "__pycache__", "dist", "build", ".pytest_cache", ".mypy_cache", ".ruff_cache"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "C4", "N", "RUF", "SIM", "TID"]
ignore = ["E501", "SIM105", "N818", "RUF001", "RUF002", "RUF022"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
argparse = {msg = "Use typer for CLIs: argparse is banned so every fleet CLI shares one framework with typed options and generated help."}

[tool.pyright]
pythonVersion = "3.13"
pythonPlatform = "All"
typeCheckingMode = "standard"
exclude = ["**/__pycache__", ".git", ".ruff_cache", ".mypy_cache", ".pytest_cache", ".tox", ".venv", "build", "dist"]

[tool.importlinter]
include_external_packages = true
