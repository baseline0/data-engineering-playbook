[project]
name = "data-engineering-playbook"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "dbt>=2.0.8",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = [
    "unit: deterministic, isolated, no external dependencies",
    "integration: tests that use real services or files across components",
    "e2e: end-to-end tests of a whole workflow",
]
