repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
        - id: trailing-whitespace
        - id: end-of-file-fixer
        - id: check-merge-conflict
        - id: check-added-large-files
          args: [--maxkb=1000]
        - id: check-yaml
          args: [--unsafe]
        - id: detect-private-key
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]
        stages: [pre-commit]

      - id: ruff-check
        name: ruff check
        entry: ruff check --fix
        language: system
        types: [python]
        stages: [pre-commit]

      - id: pytest
        name: pytest (unit tier)
        entry: pytest tests/unit
        language: system
        types: [python]
        stages: [pre-commit]
        pass_filenames: false

      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: trailing-whitespace-fixer
        language: system
        types: [text]

      - id: end-of-file-fixer
        name: fix end of file fixer
        entry: end-of-file-fixer
        language: system
        types: [text]
  - repo: local
    hooks:
      - id: repo-root-pattern
        name: "[P1] Enforce REPO_ROOT pattern (no .parent outside constants.py)"
        entry: fleet hook --name check-repo-root-pattern
        language: system
        pass_filenames: false
        files: '\.py$'
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: check-argparse-prohibition
        name: "[P1] No argparse: CLIs use Typer"
        entry: fleet hook --name check-argparse-prohibition
        language: system
        pass_filenames: false
        files: '\.py$'
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: uv-lock-check
        name: "[P1] uv.lock matches pyproject.toml (read-only; run uv lock to fix)"
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: '^(pyproject\.toml|uv\.lock)$'
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: fleet-clean-vendored
        name: "[P1] just/fleet-clean.just matches fleet-base (hand edits fail)"
        entry: just check-fleet-clean
        language: system
        pass_filenames: false
        files: '^(just/fleet-clean\.just|justfile)$'
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: check-typer-explicit
        name: "[P1] typer commands take required --name value options (ratchet against baseline)"
        entry: fleet typer-explicit check --root . --baseline .typer-explicit-baseline.json
        language: system
        pass_filenames: false
        files: '\.py$'
        stages: [pre-commit]
