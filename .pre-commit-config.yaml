repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]
        stages: [commit]

      - id: ruff-check
        name: ruff check
        entry: ruff check --fix
        language: system
        types: [python]
        stages: [commit]

      - id: pytest
        name: pytest
        entry: pytest
        language: system
        types: [python]
        stages: [commit]
        pass_filenames: false

      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: trailing-whitespace-fixer
        language: system
        types: [text]

      - id: end-of-file-fixer
        name: fix end of file fixer
        entry: end-of-file-fixer
        language: system
        types: [text]
