repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]
        stages: [pre-commit]

      - id: ruff-check
        name: ruff check
        entry: ruff check --fix
        language: system
        types: [python]
        stages: [pre-commit]

      - id: pytest
        name: pytest
        entry: pytest
        language: system
        types: [python]
        stages: [pre-commit]
        pass_filenames: false

      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: trailing-whitespace-fixer
        language: system
        types: [text]

      - id: end-of-file-fixer
        name: fix end of file fixer
        entry: end-of-file-fixer
        language: system
        types: [text]
  - repo: local
    hooks:
      - id: repo-root-pattern
        name: "[P1] Enforce REPO_ROOT pattern (no .parent outside constants.py)"
        entry: bash ../fleet-base/scripts/check-repo-root-pattern.sh
        language: system
        pass_filenames: false
        files: '\.py$'
        stages: [pre-commit]
